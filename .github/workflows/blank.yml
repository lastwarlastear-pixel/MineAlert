
name: Build Mine Alert APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y unzip p7zip-full

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p source
          ARCHIVE=$(find . -maxdepth 1 -type f \( -iname "*.zip" -o -iname "*.7z" \) | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No ZIP or 7Z archive found in repository root."
            exit 1
          fi

          case "$ARCHIVE" in
            *.7z|*.7Z) 7z x "$ARCHIVE" -osource ;;
            *) unzip -o "$ARCHIVE" -d source ;;
          esac

          PROJECT_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle in the archive."
            find source -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MineAlert-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
